[package]
name = "kriya-backend-metal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kriya-core = { path = "../kriya-core" }
kriya-kv = { path = "../kriya-kv" }
kriya-scheduler = { path = "../kriya-scheduler" }
kriya-speculate = { path = "../kriya-speculate" }
bytemuck.workspace = true
thiserror.workspace = true
tokio = { version = "1.40", features = ["sync", "rt"] }

# metal-rs crate provides safe Rust bindings to Apple's Metal API.
# This crate only compiles on macOS/iOS targets.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"

[dev-dependencies]
tempfile = "3.10"
futures.workspace = true
