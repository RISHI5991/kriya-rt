name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Code Formatting
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy Linter
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy on workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-workspace:
    name: Workspace Tests (Apple Silicon)
    runs-on: macos-14
    env:
      KRIYA_REQUIRE_METAL: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run all workspace unit and integration tests
        run: cargo test --workspace --locked

  package-check:
    name: Release Packaging Verification
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Verify release build and packaging
        run: bash packaging/build_release_package.sh 0.1.0

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kriya-rt-v0.1.0-aarch64-apple-darwin
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 14
