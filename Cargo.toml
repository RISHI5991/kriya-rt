[workspace]
resolver = "2"
members = [
    "crates/kriya-core",
    "crates/kriya-kv",
    "crates/kriya-backend-metal",
    "crates/kriya-speculate",
    "crates/kriya-scheduler",
    "crates/kriya-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
memmap2 = "0.9"
bytemuck = { version = "1.18", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.7", features = ["cors"] }
rand = "0.8"
futures-util = "0.3"
futures = "0.3"
ring = "0.17"
criterion = "0.5"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
hf-hub = { version = "0.3", features = ["tokio"] }

[patch.crates-io]
block = { path = "patches/block" }
